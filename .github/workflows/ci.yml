name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test sample-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/sample-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: examples/sample-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

  worktree-integration:
    name: Worktree scripts integration test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity for the test
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run integration test
        run: ./tests/integration.sh
